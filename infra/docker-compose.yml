version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: ai_marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiArt
      POSTGRES_USER: aiArt_user
      POSTGRES_PASSWORD: aiArt_pass
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiArt_user -d aiArt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
