spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aiArt
    username: aiArt_user
    password: aiArt_pass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    org.springframework: INFO
    com.aiart.platform: DEBUG